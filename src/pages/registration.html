<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма Регистрации</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Светло-серый фон */
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Тень для придания глубины */
            width: 320px; /* Фиксированная ширина контейнера */
            box-sizing: border-box;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333; /* Более темный цвет заголовка */
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555; /* Цвет меток полей */
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd; /* Более светлая граница */
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s ease; /* Плавная анимация границы */
        }

        .form-control:focus {
            outline: none;
            border-color: #4CAF50; /* Зеленая граница при фокусе */
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); /* Тень при фокусе */
        }

        .error-message {
            color: red;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        .btn-primary {
            background-color: #4CAF50; /* Зеленый цвет кнопки */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.3s ease; /* Плавная анимация цвета */
            margin-top: 10px;
        }

        .btn-primary:hover {
            background-color: #45a049; /* Более темный зеленый при наведении */
        }

        .btn-secondary {
            background-color: #007bff; /* Синий цвет кнопки */
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.3s ease; /* Плавная анимация цвета */
            margin-top: 10px;
            text-decoration: none; /* Убираем подчеркивание */
            text-align: center; /* Центрируем текст */
        }

        .btn-secondary:hover {
            background-color: #0056b3; /* Более темный синий при наведении */
        }

        .text-muted {
            font-size: 0.9rem;
            color: #777;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Регистрация</h2>
    <form>
        <div class="form-group">
            <label for="email">Почта</label>
            <input type="email" class="form-control" id="email" placeholder="e-mail@mail.ru">
            <div id="email-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="login">Логин</label>
            <input type="text" class="form-control" id="login" placeholder="ivanivanov">
            <div id="login-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="name">Имя</label>
            <input type="text" class="form-control" id="name" placeholder="Иван">
            <div id="name-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="surname">Фамилия</label>
            <input type="text" class="form-control" id="surname" placeholder="Иванов">
            <div id="surname-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="phone">Телефон</label>
            <input type="tel" class="form-control" id="phone" placeholder="+7 (909) 00 00 00">
            <div id="phone-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" class="form-control" id="password" placeholder="********">
            <div id="password-error" class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="confirm-password">Пароль (ещё раз)</label>
            <input type="password" class="form-control" id="confirm-password" placeholder="********">
<!--            <div id="confirm-password-error" class="error-message">Пароли не совпадают</div>-->
        </div>
        <button type="submit" class="btn-primary">Зарегистрироваться</button>
        <button type="submit" class="btn-secondary">войти</button>


    </form>
</div>

<script>
    const form = document.querySelector('form');
    const emailInput = document.getElementById('email');
    const loginInput = document.getElementById('login');
    const nameInput = document.getElementById('name');
    const surnameInput = document.getElementById('surname');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const emailError = document.getElementById('email-error');
    const loginError = document.getElementById('login-error');
    const nameError = document.getElementById('name-error');
    const surnameError = document.getElementById('surname-error');
    const phoneError = document.getElementById('phone-error');
    const passwordError = document.getElementById('password-error');
    const confirmPasswordError = document.getElementById('confirm-password-error');

    function validateEmail(email) {
        const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
        return re.test(String(email).toLowerCase());
    }

    function validatePhone(phone) {
        const re = /^\+7\s\(\d{3}\)\s\d{3}\s\d{2}\s\d{2}$/;
        return re.test(phone);
    }

    function validateForm() {
        let isValid = true;

        emailError.textContent = '';
        loginError.textContent = '';
        nameError.textContent = '';
        surnameError.textContent = '';
        phoneError.textContent = '';
        passwordError.textContent = '';
        confirmPasswordError.textContent = '';

        if (!emailInput.value.trim()) {
            emailError.textContent = 'Поле "Почта" обязательно для заполнения';
            isValid = false;
        } else if (!validateEmail(emailInput.value.trim())) {
            emailError.textContent = 'Введите корректный адрес электронной почты';
            isValid = false;
        }

        if (!loginInput.value.trim()) {
            loginError.textContent = 'Поле "Логин" обязательно для заполнения';
            isValid = false;
        }

        if (!nameInput.value.trim()) {
            nameError.textContent = 'Поле "Имя" обязательно для заполнения';
            isValid = false;
        }

        if (!surnameInput.value.trim()) {
            surnameError.textContent = 'Поле "Фамилия" обязательно для заполнения';
            isValid = false;
        }

        if (!phoneInput.value.trim()) {
            phoneError.textContent = 'Поле "Телефон" обязательно для заполнения';
            isValid = false;
        } else if (!validatePhone(phoneInput.value.trim())) {
            phoneError.textContent = 'Введите телефон в формате +7 (XXX) XXX XX XX';
            isValid = false;
        }

        if (!passwordInput.value.trim()) {
            passwordError.textContent = 'Поле "Пароль" обязательно для заполнения';
            isValid = false;
        } else if (passwordInput.value.length < 8) {
            passwordError.textContent = 'Пароль должен содержать не менее 8 символов';
            isValid = false;
        }

        if (!confirmPasswordInput.value.trim()) {
            confirmPasswordError.textContent = 'Поле "Пароль (ещё раз)" обязательно для заполнения';
            isValid = false;
        } else if (confirmPasswordInput.value !== passwordInput.value) {
            confirmPasswordError.textContent = 'Пароли не совпадают';
            isValid = false;
        }

        return isValid;
    }

    form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (validateForm()) {
            // Здесь можно добавить логику отправки данных на сервер
            alert('Форма успешно заполнена! (Это пример)');
        }
    });
</script>
</body>
</html>
