<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0; /* Светлый фон */
        }

        .login-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Тень для объема */
            text-align: center;
            width: 300px; /* Фиксированная ширина контейнера */
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333; /* Темный цвет заголовка */
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd; /* Светлая граница */
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease; /* Плавная анимация границы */
        }

        .input-group input:focus {
            border-color: #007bff; /* Цвет выделенной границы */
            outline: none; /* Убираем стандартное выделение */
        }

        .login-button {
            background-color: #007bff; /* Синий цвет кнопки */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: background-color 0.3s ease; /* Плавная анимация цвета кнопки */
        }

        .login-button:hover {
            background-color: #0056b3; /* Более темный синий при наведении */
        }

        .register-link {
            margin-top: 15px;
            font-size: 14px;
            color: #555; /* Серый цвет ссылки */
        }

        .register-link a {
            color: #007bff; /* Синий цвет ссылки */
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline; /* Подчеркивание при наведении */
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2 class="login-title">Вход</h2>
    <div class="input-group">
        <input type="text" id="username" placeholder="Логин">
    </div>
    <div class="input-group">
        <input type="password" id="password" placeholder="Пароль">
    </div>
    <button class="login-button">Авторизоваться</button>
    <p class="register-link">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
</div>
</body>
</html>
