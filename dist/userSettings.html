        <button type="button" class="btn action-button edit-button">Сохранить изменения</button>        <div class="container" >
            <button id="changePasswordBtn" class="action-button change-password-button">Сменить пароль</button>

            <div id="changePasswordModal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Сменить пароль</h2>
                        <span class="close">&times;</span>
                    </div>
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="newPassword">Текущий пароль:</label>
                            <input type="password" id="oldPassword" name="oldPassword" placeholder="Введите текущий пароль">
                        </div>
                        <div class="form-group">
                            <label for="newPassword">Новый пароль:</label>
                            <input type="password" id="newPassword" name="newPassword" placeholder="Введите новый пароль">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Подтвердите пароль:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Подтвердите новый пароль">
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="save-password-btn" id="savePasswordBtn">Сохранить</button>
                            <button type="button" class="cancel-btn" id="cancelBtn">Отмена</button>
                        </div>
                    </form>
                </div>
            </div>

        <button type="button" class="btn action-button logout-button">Выйти</button>    </div>

<script>
    const modal = document.getElementById("changePasswordModal");
    const btn = document.getElementById("changePasswordBtn");
    const closeBtn = document.querySelector(".close");
    const cancelBtn = document.getElementById("cancelBtn");
    const savePasswordBtn = document.getElementById("savePasswordBtn");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const passwordMatchError = document.getElementById("passwordMatchError");

    btn.onclick = function() {
        modal.style.display = "block";
    }

    closeBtn.onclick = function() {
        modal.style.display = "none";
    }

    cancelBtn.onclick = function() {
        modal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }

    savePasswordBtn.onclick = function() {
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (newPassword !== confirmPassword) {
            passwordMatchError.style.display = "block";
            return;
        } else {
            passwordMatchError.style.display = "none";
            // Здесь можно добавить логику для сохранения нового пароля
            alert("Пароль успешно изменен!"); // Простое уведомление
            modal.style.display = "none"; // Закрываем модальное окно после успешной смены
        }
    }
</script>
