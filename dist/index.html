<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Контекст</title>
  <script type="module" crossorigin src="/assets/main-1Ch33l6x.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-BAdRgJms.css">
</head>
<body>
<div class="registration-container">
    <form class="registration-form">
        <h2>Регистрация</h2>

        <div class="form-group">
            <label for="email">Почта</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="e-mail@mail.com"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="login">Логин</label>
            <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="ivanivanov"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="first_name">Имя</label>
            <input
                    type="text"
                    id="first_name"
                    name="first_name"
                    placeholder="Иван"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="second_name">Фамилия</label>
            <input
                    type="text"
                    id="second_name"
                    name="second_name"
                    placeholder="Иванов"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="phone">Телефон</label>
            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+7 (900) 000 00 00"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="password">Пароль</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="********"
                    value=""
                    required>
        </div>        <div class="form-group">
            <label for="password_confirm">Пароль (ещё раз)</label>
            <input
                    type="password"
                    id="password_confirm"
                    name="password_confirm"
                    placeholder="********"
                    value=""
                    required>
        </div>
        <div class="form-buttons">
            <button type="submit" class="btn btn-register">Зарегистрироваться</button>            <button type="button" class="btn btn-login">Войти</button>        </div>
    </form>
</div>

</body>
</html>
